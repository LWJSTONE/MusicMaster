# =====================================================
# MusicMaster 便携式配置文件
# 使用内嵌H2数据库，无需安装MySQL
# =====================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: musicmaster

  # H2内嵌数据库配置
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./data/musicmaster;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 禁用wall filter以支持H2
      filters: stat

  # H2控制台配置（开发调试用）
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # 初始化数据库
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.musicmaster.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: musicmaster-secret-key-2024
  expiration: 86400000

# 日志配置
logging:
  level:
    com.musicmaster: info
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# 自定义配置
file:
  upload:
    path: ./uploads/
    music-path: ./uploads/music/
    image-path: ./uploads/image/
